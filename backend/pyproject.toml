[project]
name = "toonopt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ToonOptimizer contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
# Experimental GPU surrogate model (toonopt.surrogate) only. SimulationCraft itself
# never touches the GPU. `uv sync --extra gpu` on a CUDA 12.x box; without it every
# surrogate/* module still imports and runs (predict() falls back to plain numpy).
gpu = [
    "torch>=2.6.0,<2.8",
]

[project.scripts]
toonopt = "toonopt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
